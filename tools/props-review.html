<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>官方关卡 · 道具关系测量（以通道宽 W 为单位）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161a; color: #dfe4ea;
         font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
           padding: 10px 16px; background: #1b1f24; border-bottom: 1px solid #2b3138; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  select, button { background: #23282f; color: #dfe4ea; border: 1px solid #333a42;
                   border-radius: 5px; padding: 4px 8px; font: inherit; }
  button:hover { background: #2c333b; }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr); gap: 14px; padding: 14px 16px 40px; }
  .card { background: #1b1f24; border: 1px solid #2b3138; border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: #9fb3c8; font-weight: 600; }
  .wide { grid-column: 1 / -1; }
  canvas { width: 100%; background: #101317; border-radius: 6px; display: block; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 3px 6px; border-bottom: 1px solid #262d34; text-align: right; }
  th:first-child, td:first-child { text-align: left; color: #9fb3c8; }
  .thumbs { display: flex; gap: 8px; overflow-x: auto; }
  .thumbs figure { margin: 0; flex: 0 0 auto; }
  .thumbs img { height: 150px; border-radius: 5px; border: 1px solid #2b3138; display: block; cursor: zoom-in; }
  .thumbs figcaption { font-size: 11px; color: #7d8b99; padding-top: 3px; }
  #big { display: none; position: fixed; inset: 0; background: #000c; z-index: 20; padding: 20px; }
  #big img { max-width: 100%; max-height: 100%; margin: auto; display: block; border-radius: 6px; }
  .note { color: #8b9aa8; font-size: 12px; }
  #stat { color: #cbd5e1; }
  #portrait { display: none; }
</style>
</head>
<body>
<header>
  <h1>官方关卡 · 道具关系测量</h1>
  <select id="tag"></select>
  <span id="stat"></span>
  <span class="note">单位 W = 该帧"通道开口"（左右道具内缘间距）；散点图为路面系俯视</span>
</header>
<main>
  <div class="card">
    <h2>俯视散点（横 = u 横向偏移，纵 = v 前方距离，均以 W 计）</h2>
    <canvas id="top" height="560"></canvas>
  </div>
  <div class="card">
    <h2>逐帧道具数 / 通道开口</h2>
    <canvas id="timeseries" height="230"></canvas>
    <h2 style="margin-top:12px">分布（p5 / p25 / p50 / p75 / p95）</h2>
    <table id="dist"></table>
  </div>
  <div class="card wide">
    <h2>运动学（尺度无关：速度以"路宽 W/秒"计，偏航率 °/秒；由相邻采样帧的地面平面相似变换得出）</h2>
    <canvas id="motion" height="240"></canvas>
    <div id="motionstat" class="note" style="margin-top:6px"></div>
    <div class="thumbs" id="mthumbs" style="margin-top:8px"></div>
  </div>
  <div class="card wide">
    <h2>叠加图（绿 = 识别到的"高出局部地面"的道具，红 = 路面掩膜，标注 = 宽×深×高 W / 横向偏移 W）</h2>
    <div class="thumbs" id="thumbs"></div>
  </div>
</main>
<div id="big"><img id="bigimg" alt="overlay"></div>

<script>
"use strict";
const TAGS = ["desert-a", "desert-b", "desert-c"];
const BASE = "out/tmp/props/";
const COL = ["#5aa9e6", "#8ed081", "#f4c95d", "#e8875b", "#c77dff"];

const $ = (id) => document.getElementById(id);
const fmt = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : "—");

function fit(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(200, Math.round(r.width * dpr));
  cv.height = Math.max(80, Math.round((cv.getAttribute("height") || 200) * dpr));
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w: cv.width / dpr, h: cv.height / dpr };
}

function drawTop(cv, rows) {
  const { g, w, h } = fit(cv);
  const pad = 34;
  const all = rows.flatMap((r) => r.props || []);
  if (!all.length) { g.fillStyle = "#7d8b99"; g.fillText("没有数据", 12, 24); return; }
  const umax = Math.min(60, Math.max(8, ...all.map((p) => Math.abs(p.u) + p.u_span / 2))) * 1.05;
  const vmax = Math.max(6, ...all.map((p) => p.v + p.v_span / 2)) * 1.05;
  const X = (u) => pad + (u + umax) / (2 * umax) * (w - pad - 12);
  const Y = (v) => h - 26 - (v / vmax) * (h - 26 - 14);
  g.fillStyle = "#0d1013"; g.fillRect(pad, 14, w - pad - 12, h - 40);
  g.strokeStyle = "#2b3138"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(X(0), 14); g.lineTo(X(0), h - 26); g.stroke();
  g.fillStyle = "#7d8b99"; g.font = "11px ui-monospace, monospace";
  for (let v = 0; v <= vmax; v += vmax / 5) {
    g.fillText(v.toFixed(1), 4, Y(v) + 3);
    g.strokeStyle = "#1e242a"; g.beginPath(); g.moveTo(pad, Y(v)); g.lineTo(w - 12, Y(v)); g.stroke();
  }
  g.fillText("v/W→", pad + 4, h - 6);
  for (const r of rows) {
    const hh = Math.max(...(r.props || [{ h: 1 }]).map((p) => p.h), 1);
    for (const p of r.props || []) {
      const t = Math.min(1, p.h / (hh || 1));
      g.fillStyle = COL[Math.min(COL.length - 1, Math.floor(t * COL.length))] + "dd";
      const x0 = X(p.u - p.u_span / 2), x1 = X(p.u + p.u_span / 2);
      const y0 = Y(p.v - p.v_span / 2), y1 = Y(p.v + p.v_span / 2);
      g.fillRect(Math.min(x0, x1), Math.max(y0, y1), Math.max(2, Math.abs(x1 - x0)), Math.max(2, Math.abs(y1 - y0)));
    }
  }
  g.fillStyle = "#9fb3c8";
  g.fillText("颜色=高度（蓝矮 → 紫高）；横轴 ±" + umax.toFixed(0) + "W", pad + 4, h - 6);
}

function drawSeries(cv, rows) {
  const { g, w, h } = fit(cv);
  const pad = 30;
  const n = Math.max(1, rows.length);
  const nmax = Math.max(4, ...rows.map((r) => r.n_props || 0));
  const omax = Math.max(0.5, ...rows.map((r) => (Number.isFinite(r.open_m) ? r.open_m : 0))) * 1.2;
  const X = (i) => pad + (i / Math.max(1, n - 1)) * (w - pad - 10);
  const Y1 = (v) => h - 20 - (v / nmax) * (h - 34);
  const Y2 = (v) => h - 20 - (v / omax) * (h - 34);
  g.strokeStyle = "#2b3138"; g.beginPath(); g.moveTo(pad, h - 20); g.lineTo(w - 10, h - 20); g.stroke();
  g.strokeStyle = "#8ed081"; g.lineWidth = 1.4; g.beginPath();
  rows.forEach((r, i) => { const x = X(i), y = Y1(r.n_props || 0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.strokeStyle = "#f4c95d"; g.beginPath();
  rows.forEach((r, i) => { const x = X(i), y = Y2(Number.isFinite(r.open_m) ? r.open_m : 0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.font = "11px ui-monospace, monospace"; g.fillStyle = "#8ed081";
  g.fillText("道具数 ≤" + nmax.toFixed(0), pad, 12);
  g.fillStyle = "#f4c95d"; g.fillText("开口 m ≤" + omax.toFixed(2), pad + 96, 12);
}

function distTable(sm) {
  const keys = [["u_span", "宽 u_span (W)"], ["v_span", "深 v_span (W)"], ["h", "高 h (W)"],
                ["abs_u", "|横向偏移| (W)"], ["gap_v", "同侧相邻间距 (W)"], ["px", "像素面积"]];
  let h = "<tr><th>量</th><th>p5</th><th>p25</th><th>p50</th><th>p75</th><th>p95</th></tr>";
  for (const [k, label] of keys) {
    const d = sm[k] || {};
    h += "<tr><td>" + label + "</td>" + [5, 25, 50, 75, 95].map((q) => "<td>" + fmt(d[q]) + "</td>").join("") + "</tr>";
  }
  const w = sm.W_m || {}, o = sm.open_m || {};
  h += "<tr><td>路宽 W_m (紧掩膜, 偏小)</td><td colspan=2>p50 " + fmt(w.p50, 3) + " m</td><td colspan=3>p25 " +
       fmt(w.p25, 3) + " / p75 " + fmt(w.p75, 3) + " m</td></tr>";
  h += "<tr><td>通道开口 open_m</td><td colspan=5>p25 " + fmt(o.p25, 3) + " / p50 " + fmt(o.p50, 3) + " / p75 " + fmt(o.p75, 3) + " m</td></tr>";
  h += "<tr><td>帧数 / 道具数</td><td colspan=5>" + (sm.frames || 0) + " / " + (sm.props || 0) + "</td></tr>";
  return h;
}

async function load(tag) {
  const jl = await fetch(BASE + tag + "-props.jsonl").then((r) => (r.ok ? r.text() : ""));
  const rows = jl.trim() ? jl.trim().split("\n").map((s) => JSON.parse(s)) : [];
  let sm = {};
  try { sm = await fetch(BASE + tag + "-summary.json").then((r) => (r.ok ? r.json() : {})); } catch (e) { sm = {}; }
  const overlays = rows.filter((r) => r.overlay).map((r) => r.overlay);
  return { rows, sm, overlays: overlays.length ? overlays : null };
}

function drawMotion(cv, rows, sm) {
  const { g, w, h } = fit(cv);
  const pad = 40;
  if (!rows.length) { g.fillStyle = "#7d8b99"; g.fillText("没有运动数据", 12, 24); return; }
  const xs = rows.map((r) => r.i);
  const xmax = Math.max(...xs, 1);
  const smax = Math.max(1, ...rows.map((r) => r.speed_Ws || 0)) * 1.1;
  const ymax = Math.max(4, ...rows.map((r) => Math.abs(r.yaw_dps || 0))) * 1.1;
  const X = (i) => pad + (i / xmax) * (w - pad - 12);
  g.fillStyle = "#0d1013"; g.fillRect(pad, 12, w - pad - 12, h - 34);
  g.strokeStyle = "#1e242a";
  for (let q = 0; q <= 4; q++) { const y = h - 22 - (q / 4) * (h - 40); g.beginPath(); g.moveTo(pad, y); g.lineTo(w - 12, y); g.stroke(); }
  const YS = (v) => h - 22 - (v / smax) * (h - 40);
  const YY = (v) => h - 22 - ((v + ymax) / (2 * ymax)) * (h - 40);
  g.strokeStyle = "#8ed081"; g.lineWidth = 1.6; g.beginPath();
  rows.forEach((r, i) => { const x = X(r.i), y = YS(r.speed_Ws || 0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.strokeStyle = "#e8875b"; g.lineWidth = 1.4; g.beginPath();
  rows.forEach((r, i) => { const x = X(r.i), y = YY(r.yaw_dps || 0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  g.strokeStyle = "#666"; g.setLineDash([3, 3]); g.beginPath();
  g.moveTo(pad, YY(0)); g.lineTo(w - 12, YY(0)); g.stroke(); g.setLineDash([]);
  g.fillStyle = "#8ed081"; g.font = "11px ui-monospace, monospace";
  g.fillText("速度 ≤" + smax.toFixed(1) + " W/s", pad + 2, 22);
  g.fillStyle = "#e8875b"; g.fillText("偏航率 ±" + ymax.toFixed(0) + " °/s", pad + 130, 22);
  g.fillStyle = "#7d8b99";
  g.fillText("时间 → " + (xmax / (sm.dt ? 1 / sm.dt : 3.33)).toFixed(0) + "s", pad + 2, h - 6);
}

function motionStat(sm) {
  if (!sm || !sm.pairs) return "（无运动数据）";
  const p = (d, q) => (d && Number.isFinite(d[q]) ? d[q].toFixed(2) : "—");
  return "样本 " + sm.pairs + " 对（dt=" + fmt(sm.dt, 2) + "s）｜速度 p5/50/95 = " + p(sm.speed_Ws, 5) + " / " +
    p(sm.speed_Ws, 50) + " / " + p(sm.speed_Ws, 95) + " W/s｜偏航率 |p95| = " + fmt(sm.yaw_abs_p95, 1) +
    " °/s｜折点 " + (sm.turns || 0) + " 个（阈值 " + fmt(sm.turn_thr_dps, 1) + " °/s）｜折点间距 p50 = " +
    p(sm.leg_m, 50) + " MoGe米 = " + p(sm.leg_W, 50) + " W｜路宽(W, MoGe单位) p50 = " + p(sm.W_m, 50);
}

async function showMotion(tag) {
  let rows = [], sm = {};
  try {
    const t = await fetch("out/tmp/motion/" + tag + "-motion.jsonl").then((r) => (r.ok ? r.text() : ""));
    rows = t.trim() ? t.trim().split("\n").map((s) => JSON.parse(s)) : [];
    sm = await fetch("out/tmp/motion/" + tag + "-motion.json").then((r) => (r.ok ? r.json() : {}));
  } catch (e) { /* ignore */ }
  drawMotion($("motion"), rows, sm);
  $("motionstat").textContent = motionStat(sm);
  const mt = $("mthumbs");
  mt.innerHTML = "";
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.src = "out/tmp/motion/" + tag + "-yaw.png";
  img.onclick = () => { $("bigimg").src = img.src; $("big").style.display = "block"; };
  const cap = document.createElement("figcaption");
  cap.textContent = tag + "-yaw.png（速度/偏航率曲线）";
  fig.append(img, cap);
  mt.append(fig);
}

async function show(tag) {
  $("stat").textContent = "载入 " + tag + " …";
  const { rows, sm, overlays } = await load(tag);
  $("stat").textContent = tag + " · " + rows.length + " 帧 · " + (sm.props || 0) + " 个道具";
  drawTop($("top"), rows);
  drawSeries($("timeseries"), rows);
  $("dist").innerHTML = distTable(sm);
  const th = $("thumbs");
  th.innerHTML = "";
  let list = overlays;
  if (!list) {
    list = await fetch(BASE + "index.json").then((r) => (r.ok ? r.json() : {})).then((ix) => (ix[tag] || {}).overlays || []).catch(() => []);
  }
  for (const src of list) {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = BASE + (src.includes("/") ? src : src);
    img.onclick = () => { $("bigimg").src = img.src; $("big").style.display = "block"; };
    const cap = document.createElement("figcaption");
    cap.textContent = src.split("/").pop().replace(/^.*-overlay-/, "").replace(".png", "");
    fig.append(img, cap);
    th.append(fig);
  }
  if (!list.length) th.innerHTML = "<span class='note'>没有叠加图（用 --save-overlays 生成）</span>";
  showMotion(tag);
}

$("big").onclick = () => { $("big").style.display = "none"; };
const sel = $("tag");
for (const t of TAGS) { const o = document.createElement("option"); o.value = o.textContent = t; sel.append(o); }
sel.onchange = () => show(sel.value);
window.addEventListener("resize", () => show(sel.value));
show(TAGS[0]);
</script>
</body>
</html>
